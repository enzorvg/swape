name: swape

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: swape
      POSTGRES_PASSWORD: swape
      POSTGRES_DB: swape
    ports:
      - '5434:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swape -d swape']
      interval: 2s
      timeout: 3s
      retries: 20

  # Separate database for tests, kept in RAM: wiped on every restart.
  db-test:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: swape
      POSTGRES_PASSWORD: swape
      POSTGRES_DB: swape_test
    ports:
      - '5435:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swape -d swape_test']
      interval: 2s
      timeout: 3s
      retries: 20

  # Reserved for WebSocket pub/sub (messaging, Job Simulation) once we run several API workers.
  # redis:
  #   image: redis:8-alpine
  #   ports:
  #     - "6379:6379"

volumes:
  db-data:
